services:
  - type: web
    name: govtfund-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: FUNDSYSTEM
      - key: JWT_SECRET
        generateValue: true
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: CHAIN_ID
        value: 5777
      - key: FINANCE_PRIVATE_KEY
        sync: false
      - key: STATE_PRIVATE_KEY
        sync: false
      - key: DISTRICT_PRIVATE_KEY
        sync: false
      - key: CONTRACTOR_PRIVATE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
